spring:
  datasource:
    url: ${H2_URL:jdbc:h2:file:./data/h2/session-memory;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${H2_USERNAME:sa}
    password: ${H2_PASSWORD:}
  ai:
    session:
      time-to-live: 60d
      repository:
        jdbc:
          initialize-schema: always
