services:
  postgres:
    image: postgres:18
    container_name: yan-ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yan_ai_agent}
      POSTGRES_USER: ${POSTGRES_USERNAME:-yanai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yanai123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - yan-ai-agent-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  yan-ai-agent-postgres-data:
